# Model constants: agencies, jurisdictions, and source file names. Edited by hand.
schema: tahoe-transit-funding-data/1
modelVersion: tahoe-transit-funding-1.0
sourceFiles:
  scen: Example Transit Financial Scenario Workbook.xlsx
  plan: Financial PlanG.xlsx
  v1g: Funding Model V1G.xlsx
  sstma: SSTMA multijurisdiction transit services working model.xlsx
  fed: Federal Funds – FINAL.pdf
  state: State Funds – FINAL.pdf
  loc1: Local Funds 1 of 2 – FINAL.pdf
  loc2: Local Funds 2 of 2 – FINAL.pdf
sourceFileNotes:
  scen: Most current operator costs per route; state and local route conditions (costs tab); operator rates (VRH Rates).
  plan: Revenue sources by percent to routes (Revenue %s), revenue conditions and match notes, per-route model, FTA split, five-year financial
    plan tables, TNT/TMA budget.
  v1g: Earlier funding model; used for corrected VSH bases.
  sstma: Multi-jurisdiction cost-share method (miles, hours, stops, ridership) and Lake Link zone structure.
  fed: Federal funding fact sheet (FY 25-26 budgeted amounts, purpose, match, restrictions).
  state: State funding fact sheet.
  loc1: Local funding fact sheet, part 1.
  loc2: Local funding fact sheet, part 2 (Lake Link partners).
# Published documents cited in the model, numbered after the workbooks, fact sheets, and TRPA direction.
references:
  tartPlan:
    name: TART 2025 Systems Plan Update, Board presentation, Item 04A, Placer County Board of Supervisors, November 18, 2025
    note: Preferred service scenario and the cost of 30-minute peak service on TART fixed routes (slides 30 and 31).
    url: https://www.placer.ca.gov/DocumentCenter/View/99365/2025-111825-PowerPoint-Item-04A-DPW---Tahoe-Truckee-Area-Regional-Transit-2025-Systems-Plan-Update
  tartMemo:
    name: TART 2025 Systems Plan Update, staff report, Placer County Public Works, November 18, 2025
    note: Current 60-minute frequency on all TART fixed routes, and the peak-season and year-round 30-minute options.
    url: https://www.placer.ca.gov/DocumentCenter/View/99284/04A
# Scenario inputs taken from published plans. Used by the scenario presets.
scenarios:
  peak30:
    # 30-minute frequency on TART fixed routes in the winter and summer months, from 60 minutes today.
    cost: 2683400           # annual operating cost increase; applied to FY 26-27, then TART's escalator each year
    hours: 16100            # added annual service hours
    miles: 318200           # added annual service miles
    riders: 153000          # added annual riders
    routes: [TART-WS, TART-NS, TART-NV, '89', '267']   # Main Line (West Shore, North Shore, Nevada), Hwy 89, Hwy 267. Night service is not included.
    split: Placeholder. The plan gives a systemwide total. The model splits it across routes by each route's annual service hours.
    cite: [tartPlan, tartMemo]
