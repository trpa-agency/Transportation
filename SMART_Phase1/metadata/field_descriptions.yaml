# Field definitions for the Transportation_SMART feature service.
#
# This file is the source of truth for the data dictionary. Run
#   python scripts/build_data_dictionary.py
# to regenerate Documentation/Data_Dictionary.csv from the LIVE layer schemas
# joined to these descriptions. Any live field with no entry here is reported,
# so the dictionary cannot silently drift out of date with the service.
#
# Entries marked `needs_review: true` are surfaced by the generator as
# unconfirmed. The Derq INSIGHT API v2.0 PDF documents the request/response
# shape but carries no glossary of event-type codes, so a few expansions below
# are inferred and should be confirmed with Derq before the next data package
# is published.

# Applied to every layer unless overridden in the layer's own block.
common:
  OBJECTID: Internal ArcGIS row identifier. Not stable across reloads.
  GlobalID: Globally unique ArcGIS row identifier.
  created_user: ArcGIS user that created the row (editor tracking).
  created_date: Timestamp the row was created (editor tracking).
  last_edited_user: ArcGIS user that last edited the row (editor tracking).
  last_edited_date: Timestamp the row was last edited (editor tracking).
  LocationId: >-
    Derq's unique identifier for a camera location. Joins every table back to
    the SMART Traffic Camera layer.
  LocationName: Human-readable name of the camera location.
  counts: Number of observations aggregated into this row.
  Date: Date of observation, stored as UTC midnight.
  timeInterval: >-
    Fifteen-minute collection window the row covers, as a local-time label
    (for example "02:30 PM - 02:44 PM").
  approach: >-
    Direction of travel on approach to the intersection (NB, SB, EB, WB).
  class: >-
    Object classification assigned by the camera's computer vision model
    (for example passenger_vehicle, bus, bicycle, pedestrian).

layers:

  0:
    table: SMART Traffic Camera
    description: >-
      Locations of the AI-enabled traffic cameras deployed around the Lake
      Tahoe Basin under the SMART grant. The authoritative, manually curated
      location list; the ETL reads it rather than the Derq /locations endpoint.
    fields:
      Latitude: Latitude of the camera location in decimal degrees (WGS 84).
      Longitude: Longitude of the camera location in decimal degrees (WGS 84).
      Status: >-
        Deployment type. "Permanent" for a fixed installation, "Temporary" for
        a short-term or relocatable deployment.
      DateRange: >-
        Free-text period the camera was active. Populated by hand; currently
        null for all locations.

  1:
    table: Safety Insights
    description: >-
      Individual safety events detected by the cameras -- near misses,
      violations, wrong-way driving, and crashes. One row per event.
    fields:
      EventType:
        # A field entry may be a plain string, or this mapping form when the
        # definition is not yet confirmed.
        needs_review: true
        definition: >-
          Event classification code. One of IC, WWD, STPV, TV, LCV, RLV, NM-VV,
          NM-VRU, CRSH. Confirmed expansions: WWD = wrong-way driving,
          RLV = red light violation, NM-VV = near miss between two vehicles,
          NM-VRU = near miss between a vehicle and a vulnerable road user,
          CRSH = crash, IC = illegal crossing. STPV, TV and LCV are inferred as
          stopped vehicle, turn violation and lane change violation
          respectively and are NOT yet confirmed with Derq.
      EventId: Derq's unique identifier for the event.
      TimeAtSite: >-
        Timestamp of the event at the camera site, to the millisecond. Stored
        in UTC.
      DetectionArea: >-
        Part of the intersection where the event was detected (for example
        "West Leg", "North Leg").
      Direction: Compass direction of travel of the primary object involved.
      CameraId: >-
        Index of the camera at the location that recorded the event. Zero for
        single-camera sites.
      Object1Class: Classification of the primary object involved in the event.
      Object2Class: >-
        Classification of the second object involved. Null for single-object
        events such as a stopped vehicle.
      Movement: Movement the primary object was making (through, left, right).
      Camera_Status: >-
        Deployment type of the camera that recorded the event ("Permanent" or
        "Temporary"). A denormalized copy of Status on the SMART Traffic Camera
        layer, joined on LocationId when the row is loaded.

  2:
    table: Speed
    description: >-
      Distribution of observed vehicle speeds by location and approach,
      aggregated over the Phase 1 period of record (through September 2025).
      Frozen: the Derq /speed-distribution endpoint left TRPA's subscription in
      August 2026, so this table is retained as a historical record and no
      longer updated.
    fields:
      speedinterval: >-
        Speed bucket in miles per hour, using the 5/10/15/20/25 mph break
        points (for example "20-24 mph", "25+ mph").
      counts: Number of vehicles observed in this speed bucket.

  3:
    table: Vehicle Counts
    description: >-
      Vehicle counts in fifteen-minute intervals by location, approach, and
      vehicle class. One row per Derq observation record.
    fields:
      counts: Number of vehicles observed in this interval.

  4:
    table: VRU Counts
    description: >-
      Vulnerable road user (pedestrian, bicyclist, and similar) counts in
      fifteen-minute intervals by location, approach, and class.
    fields:
      counts: Number of vulnerable road users observed in this interval.

  5:
    table: Daily Vehicle Counts
    description: >-
      Daily vehicle totals per location, derived by summing the fifteen-minute
      Vehicle Counts records. Not fetched from Derq directly.
    fields:
      counts: Total vehicles observed at this location on this date.
