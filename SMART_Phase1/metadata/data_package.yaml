description: >-
  Sample data collected during Phase 1 of Tahoe Transportation District's SMART
  grant from AI Cameras deployed around the Tahoe Basin. The dataset includes
  camera locations, safety insights, vehicle counts, VRU counts, and sample
  videos recorded of wrong way drivers.

abstract: >-
  The Tahoe Transportation District (TTD) and regional partners are seeking to
  enhance transportation safety and mobility along key corridors in the Lake
  Tahoe Basin. The roadway network entering, traveling within, and leaving the
  Tahoe Basin lacks the infrastructure required to acquire real-time and
  historical traffic and congestion data. This pilot project aims to support TTD
  and the regional partners in collecting accurate count data at each of the
  seven entry/exit points of the Tahoe Basin and along the
  Truckee/US80/SR267/SR89 roadways. The project is designed to plan, prototype,
  test, and evaluate a limited deployment of a data collection sensor
  infrastructure to gather transportation and traveler-related information. The
  goal is to integrate this information into a single cloud-based open source or
  interface for reporting and management. This information will be utilized by
  TTD, TRPA, partners, commuters, and travelers within the Tahoe Basin and
  adjoining areas to provide an integrated infrastructure for collecting vehicle
  data. This data will be incorporated into a database for various stakeholders.
  Furthermore, the project will establish the framework for long-term data
  collection across the region and integrate multiple transportation data
  sources for efficient use by partner agencies. It will propel the region
  toward real-time parking availability for motorists and improve the ease of
  transit use, walking, and bicycling. Other long-term uses include sharing
  information about weather hazards, closures, construction, or crashes.

methods: >-
  The Intelligent Sensor Integration on Rural Multi-Modal System project
  leverages a suite of innovative, cloud-based and AI-driven technologies to
  modernize data collection and enhance transportation safety and planning in
  the Lake Tahoe Basin. The project deploys AI-powered video sensors at multiple
  locations throughout the Lake Tahoe Basin to capture multimodal traffic
  activity, including vehicle counts, pedestrian movements, bicyclist volumes,
  travel speeds, and roadway safety events. These sensors operate in three
  different technical configurations: Edge Processing, where video streams are
  analyzed directly in the field using AI processors connected through
  commercial cellular or satellite networks; Centralized Server Processing,
  where video feeds are transmitted to an AI server located at the Caltrans
  Traffic Management Center (TMC); and Cloud Processing, where video feeds
  provided by NDOT are analyzed using cloud-based machine learning platforms.
  All collected data is aggregated in a secure, cloud-hosted platform for
  storage, processing, and integration. The project emphasizes interoperability
  and accessibility by developing an online open-data portal in collaboration
  with the Tahoe Regional Planning Agency (TRPA).

software_notes: >-
  The .csv, Comma Separated Value, file is a simple format designed for a
  database table and supported by many applications. The most common software
  used to open .csv files are Microsoft Excel and RecordEditor. The .geojson
  format is an open geospatial format that can be opened by many GIS programs,
  such as ArcGIS and QGIS. The .wmv format stores video and can be played using
  most standard audio and visual software, such as Windows Media Player or VLC.

