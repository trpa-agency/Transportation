# Layers exported from the live feature service, in package file order.
# `row_represents` feeds section E of the README.
exports:
  - layer_id: 1
    filename: TTD_SMART_SafetyInsights.csv
    format: csv
    description: >-
      A .csv, Comma Separated Value, file of safety insights from the SMART
      Grant cameras in the Tahoe Basin.
    row_represents: 1 recorded safety event
  - layer_id: 2
    filename: TTD_SMART_Speed.csv
    format: csv
    description: >-
      The .csv, Comma Separated Value, file of vehicle speed data from the SMART
      Grant cameras in the Tahoe Basin.
    row_represents: >-
      Recorded vehicle counts for a given speed interval from a specific
      direction at a specified camera location
  - layer_id: 0
    filename: TTD_SMART_TrafficCameraLocations.geojson
    format: geojson
    description: >-
      A .geojson spatial file with the locations of the SMART Grant cameras in
      the Tahoe Basin.
    row_represents: 1 camera location
  - layer_id: 3
    filename: TTD_SMART_VehicleCounts.csv
    format: csv
    description: >-
      A .csv, Comma Separated Value, file of vehicle counts from the SMART Grant
      cameras in the Tahoe Basin.
    row_represents: >-
      Recorded vehicle counts during a specified time interval from a specific
      direction at a specified camera location, classified by vehicle type
  - layer_id: 4
    filename: TTD_SMART_VRUCounts.csv
    format: csv
    description: >-
      A .csv, Comma Separated Value, file of vulnerable road user counts from
      the SMART Grant cameras in the Tahoe Basin.
    row_represents: >-
      Recorded vulnerable road user counts for a given time interval from a
      specific direction at a specified camera location

